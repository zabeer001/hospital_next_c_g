name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install SSH password client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Build and deploy on production VPS
        env:
          VPS_ROOT_ACCESS: ${{ secrets.VPS_ROOT_ACCESS }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
          VPS_APP_CONTAINER: ${{ secrets.VPS_APP_CONTAINER }}
        run: |
          set -Eeuo pipefail

          SSH_TARGET="${VPS_ROOT_ACCESS#ssh }"
          export SSHPASS="$VPS_PASSWORD"

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_TARGET" \
            bash -se -- \
            "$VPS_PROJECT_DIR" \
            "$VPS_APP_CONTAINER" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          PROJECT_DIR="$1"
          APP_CONTAINER="$2"

          cd "$PROJECT_DIR"
          git fetch origin main
          git checkout main

          # Allow the one-time VPS Dockerfile hotfix only when its resulting
          # content is already identical to the incoming committed version.
          if ! git diff --quiet -- Dockerfile; then
            if git diff --quiet origin/main -- Dockerfile; then
              git restore -- Dockerfile
            else
              echo "VPS Dockerfile has changes not present in origin/main" >&2
              git diff -- Dockerfile >&2
              exit 1
            fi
          fi

          git pull --ff-only origin main

          if [ ! -f .env ]; then
            echo "Production .env is missing in $PROJECT_DIR" >&2
            exit 1
          fi

          API_URL="$(sed -n 's/^NEXT_PUBLIC_API_URL=//p' .env | tail -n 1 | tr -d '\r')"
          API_URL="${API_URL%\"}"
          API_URL="${API_URL#\"}"

          if [ -z "$API_URL" ] || [[ "$API_URL" == *localhost* ]]; then
            echo "NEXT_PUBLIC_API_URL is missing or points to localhost in the production .env" >&2
            exit 1
          fi

          docker compose build doctor-tracker-web

          if ! docker run --rm \
            --entrypoint sh \
            -e EXPECTED_API_URL="$API_URL" \
            doctor-tracker-frontend:latest \
            -c 'grep -R -q -F "$EXPECTED_API_URL" /app/dist'; then
            echo "Built frontend does not contain the production NEXT_PUBLIC_API_URL" >&2
            exit 1
          fi

          docker compose up -d --force-recreate doctor-tracker-web

          for attempt in $(seq 1 12); do
            STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER")"
            if [ "$STATUS" = healthy ] || [ "$STATUS" = running ]; then
              docker ps --filter "name=^/${APP_CONTAINER}$" --format 'deployed: {{.Names}} ({{.Status}})'
              exit 0
            fi
            if [ "$STATUS" = unhealthy ] || [ "$STATUS" = exited ] || [ "$STATUS" = dead ]; then
              docker logs --tail 100 "$APP_CONTAINER"
              exit 1
            fi
            sleep 5
          done

          docker logs --tail 100 "$APP_CONTAINER"
          echo "Container did not become ready before the timeout" >&2
          exit 1
          REMOTE_SCRIPT
