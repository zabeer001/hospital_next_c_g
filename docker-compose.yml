services:
  doctor-tracker-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_LOGIN_URL: ${NEXT_PUBLIC_APP_LOGIN_URL:-}
    image: doctor-tracker-frontend:latest
    container_name: doctor-tracker-frontend
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
